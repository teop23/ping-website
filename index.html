<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F3F1EA" />
  <meta name="color-scheme" content="light" />

  <!-- Full-bleed lime, the same #CCFF00 as --brand. The old icon was the
       character floating in a lot of white padding, which at 16px is a grey
       speck in a white chip; a solid brand tile is what a tab strip can
       actually be scanned for. Sizes differ in crop, not just resolution:
       small ones are cropped tighter, and 512 leaves Android's maskable safe
       zone free. -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Martian+Mono:wdth,wght@75..112.5,300..700&display=swap"
    rel="stylesheet" />

  <title>PING</title>
  <meta name="description"
    content="Build a PING character from __TRAIT_COUNT__ traits. An open image API, a trait editor, and a token on Robinhood Chain." />
  <link rel="canonical" href="__SITE_URL__/" />

  <!-- The site URL and trait count placeholders below are swapped for real
       values at build time (see the injectLaunchValues plugin in
       vite.config.ts) from /launch.config.mjs and
       public/traits-manifest.json - index.html is static HTML and can't
       import either at runtime, so this is the one place values get baked in
       as text instead of read as a module. These are the only tags in the
       project carrying a hardcoded host. Everything server-rendered derives
       its own origin, and the API examples in the docs read
       window.location.origin, so a preview deployment describes itself
       rather than production.

       og:image must be absolute: a relative path is resolved against the
       scraper's own context, not the page, so most of them - X included -
       fetch nothing and the card falls back to a bare link. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="PING" />
  <meta property="og:url" content="__SITE_URL__/" />
  <meta property="og:title" content="PING" />
  <meta property="og:description"
    content="Build a PING character from __TRAIT_COUNT__ traits. An open image API, a trait editor, and a token on Robinhood Chain." />
  <meta property="og:image" content="__SITE_URL__/opengraph-ping.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="A PING character in a cowboy hat and sunglasses, holding a bitcoin." />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="PING" />
  <meta name="twitter:description"
    content="Build a PING character from __TRAIT_COUNT__ traits. An open image API, a trait editor, and a token on Robinhood Chain." />
  <meta name="twitter:image" content="__SITE_URL__/opengraph-ping.png" />
  <meta name="twitter:image:alt" content="A PING character in a cowboy hat and sunglasses, holding a bitcoin." />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
