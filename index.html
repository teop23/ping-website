<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F3F1EA" />
  <meta name="color-scheme" content="light" />

  <!-- Full-bleed lime, the same #CCFF00 as --brand. The old icon was the
       character floating in a lot of white padding, which at 16px is a grey
       speck in a white chip; a solid brand tile is what a tab strip can
       actually be scanned for. Sizes differ in crop, not just resolution:
       small ones are cropped tighter, and 512 leaves Android's maskable safe
       zone free. -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Martian+Mono:wdth,wght@75..112.5,300..700&display=swap"
    rel="stylesheet" />

  <title>PING</title>
  <meta name="description"
    content="Build a PING character from 176 community-made traits. An open image API, a trait editor, and a token on Robinhood Chain." />

  <!-- TODO(relaunch): set these to the new domain once it is registered.
       Everything server-rendered already derives its own origin; only these
       static tags carry a hardcoded host. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="PING" />
  <meta property="og:title" content="PING" />
  <meta property="og:description"
    content="Build a PING character from 176 community-made traits. An open image API, a trait editor, and a token on Robinhood Chain." />
  <meta property="og:image" content="/opengraph-ping.png" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="PING" />
  <meta name="twitter:description"
    content="Build a PING character from 176 community-made traits. An open image API, a trait editor, and a token on Robinhood Chain." />
  <meta name="twitter:image" content="/opengraph-ping.png" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
